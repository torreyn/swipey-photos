name: release

# Tag a commit (`git tag -a v1.0.0 -m "1.0.0" && git push origin v1.0.0`) and
# this workflow attaches the artefacts to the GitHub Release: a one-file Linux
# binary, an AppImage that also carries the Qt system libraries, the wheel and
# the sdist.
#
# Manual runs (`workflow_dispatch`) take the tag as an input, so a re-upload
# after a flaky runner does not need a new tag.
#
# The AppImage job runs packaging/appimage/build-appimage.sh, the same script a
# maintainer runs locally, so the released file cannot drift from the recipe in
# docs/PACKAGING.md §4. It downloads a python-build-standalone interpreter and
# upstream's appimagetool; the script detects that runners have no FUSE and lets
# appimagetool unpack itself.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  binary:
    name: binary (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # PyInstaller imports PyQt6 while running its hooks; the same libraries
      # the test job needs keep that import happy.
      - name: Install the Qt platform libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0

      - name: Install the project and PyInstaller
        run: pip install ".[binary]"

      # Same recipe as scripts/build.sh, so a local build and the released
      # binary cannot drift apart.
      - name: Build the one-file executable
        run: pyinstaller --clean --noconfirm --distpath dist swipey-photos.spec

      - name: Smoke-test the binary
        run: |
          ./dist/swipey-photos --version
          ./dist/swipey-photos --help > /dev/null

      - name: Name the asset after the tag
        run: mv dist/swipey-photos "dist/swipey-photos-${TAG}-linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: binary
          path: dist/swipey-photos-*
          if-no-files-found: error

  appimage:
    name: appimage (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The staged-bundle check imports PyQt6 before the squashfs is written, so
      # the runner needs the same Qt client libraries the binary job installs.
      - name: Install the Qt platform libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0

      # The bundle embeds CPython, and it has to be a *relocatable* build: a
      # distribution Python links /usr/lib/libpython, which is absent on the
      # user's machine. python-build-standalone (what uv downloads) is not.
      - uses: astral-sh/setup-uv@v5
      - name: Install a relocatable CPython
        run: uv python install 3.13

      # Upstream's appimagetool, the tool the recipe was verified against. It is
      # itself an AppImage; the build script spots the missing FUSE on runners
      # and reruns it with --appimage-extract-and-run.
      - name: Fetch appimagetool
        run: |
          curl -sSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --version

      - name: Build the AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool
        run: ./packaging/appimage/build-appimage.sh

      # Runners have no libfuse2, so the AppImage is unpacked to a temporary
      # directory instead of mounted. That still executes the bundled
      # interpreter, which is what the smoke test is for.
      - name: Smoke-test the AppImage
        run: |
          APPIMAGE=$(ls build/appimage/swipey-photos-*.AppImage)
          echo "$APPIMAGE"
          export APPIMAGE_EXTRACT_AND_RUN=1
          "./$APPIMAGE" --version
          "./$APPIMAGE" --help > /dev/null

      - name: Name the asset after the tag
        run: |
          mv build/appimage/swipey-photos-*.AppImage \
            "build/appimage/swipey-photos-${TAG}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: build/appimage/swipey-photos-*.AppImage
          if-no-files-found: error

  dist:
    name: sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and check the distributions
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [binary, appimage, dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List the assets
        run: ls -l release-assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
