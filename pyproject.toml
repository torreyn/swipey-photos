[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "swipey-photos"
dynamic = ["version"]
description = "Sort images in a folder with Tinder-style swipe gestures on Linux."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Swipey Photos contributors" }]
keywords = ["images", "photos", "sorting", "culling", "pyqt6", "qt", "linux", "desktop"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Viewers",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "PyQt6>=6.6,<7",
  "Pillow>=10.0,<12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-qt>=4.4",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.2",
  # PyYAML lets tests/test_packaging.py parse the workflow files, so a broken
  # `ci.yml` fails locally instead of on the first push.
  "pyyaml>=6.0",
]
# `pip install ".[binary]"` is all scripts/build.sh and the release workflow
# need; PyInstaller is kept out of the dev extra because it is ~50 MB.
binary = ["pyinstaller>=6.10"]

[project.scripts]
swipey-photos = "swipey_photos.__main__:main"

[project.urls]
Homepage = "https://github.com/torreyn/swipey-photos"
Documentation = "https://github.com/torreyn/swipey-photos/tree/main/docs"
Issues = "https://github.com/torreyn/swipey-photos/issues"
Source = "https://github.com/torreyn/swipey-photos"

[tool.hatch.version]
path = "src/swipey_photos/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/swipey_photos"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/packaging",
  "/scripts",
  "/screenshots",
  "/README.md",
  "/LICENSE",
  "/CONTRIBUTING.md",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/swipey-photos.spec",
  "/pyproject.toml",
  "/requirements.txt",
]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # Line length is enforced by `ruff format`, not the linter.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "gui: tests that construct Qt widgets (run with QT_QPA_PLATFORM=offscreen)",
  "integration: tests that touch the real filesystem beyond tmp_path helpers",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/swipey_photos"]
warn_unreachable = true

[tool.coverage.run]
# Measure the package, not the tests; `pip install -e .` keeps the paths stable.
source = ["swipey_photos"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Platform-specific and defensive branches that cannot be exercised in CI.
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

